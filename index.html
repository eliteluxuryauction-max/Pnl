<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PNL</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b11;
  color: white;
  font-family: Arial, sans-serif;
}

/* =========================
   EDITOR
========================= */

.editor {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  padding: 20px;
}

.editor h2 {
  margin-top: 0;
}

input,
button {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: 1px solid #303743;
  font-size: 16px;
}

input {
  background: #151a22;
  color: white;
}

button {
  background: #6040e8;
  color: white;
  border: 0;
  font-weight: bold;
  cursor: pointer;
}

/* =========================
   PNL CARD
========================= */

.pnl-card {
  position: relative;
  width: 100%;
  max-width: 900px;
  height: 560px;
  margin: 30px auto;

  overflow: hidden;
  border-radius: 20px;

  background: #10151d;
}

/* VIDEO */

.pnl-video {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  z-index: 0;
}

/* DARK OVERLAY */

.pnl-overlay {
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.25),
      rgba(0,0,0,.72)
    );

  z-index: 1;
}

/* CONTENT */

.pnl-content {
  position: relative;
  z-index: 2;

  height: 100%;

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  text-align: center;

  padding: 30px;
}

/* BRAND */

.brand {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 45px;
}

.brand span {
  color: #20e49b;
}

/* TOKEN */

.token {
  font-size: 20px;
  color: #cbd1dc;
  margin-bottom: 15px;
}

/* PNL */

.pnl {
  font-size: 70px;
  font-weight: 800;
  letter-spacing: -3px;

  color: #20e49b;
}

.percent {
  margin-top: 8px;

  font-size: 30px;
  font-weight: bold;

  color: #20e49b;
}

/* DETAILS */

.details {
  display: flex;
  gap: 70px;

  margin-top: 50px;
}

.detail-label {
  font-size: 13px;
  color: #aab1bd;
  margin-bottom: 7px;
}

.detail-value {
  font-size: 22px;
  font-weight: bold;
}

/* DATE */

.date {
  position: absolute;

  bottom: 20px;

  font-size: 13px;

  color: #aab1bd;
}
</style>
</head>

<body>

<!-- =========================
     EDITOR
========================= -->

<div class="editor">

  <h2>Create PNL</h2>

  <input
    type="file"
    id="videoInput"
    accept="video/*"
  >

  <input
    type="text"
    id="tokenInput"
    placeholder="Token name"
    value="SOL"
  >

  <input
    type="text"
    id="pnlInput"
    placeholder="PNL amount"
    value="+$12,450.00"
  >

  <input
    type="text"
    id="percentInput"
    placeholder="Profit percentage"
    value="+248.7%"
  >

  <input
    type="text"
    id="entryInput"
    placeholder="Entry amount"
    value="$5,000"
  >

  <input
    type="text"
    id="exitInput"
    placeholder="Exit amount"
    value="$17,450"
  >

  <button onclick="updatePNL()">
    Update PNL
  </button>

</div>


<!-- =========================
     PNL PREVIEW
========================= -->

<div class="pnl-card">

  <video
    id="backgroundVideo"
    class="pnl-video"
    autoplay
    muted
    loop
    playsinline>
  </video>

  <div class="pnl-overlay"></div>

  <div class="pnl-content">

    <div class="brand">
      sniper.<span>sol</span>
    </div>

    <div
      class="token"
      id="token">
      SOL
    </div>

    <div
      class="pnl"
      id="pnl">
      +$12,450.00
    </div>

    <div
      class="percent"
      id="percent">
      +248.7%
    </div>

    <div class="details">

      <div>
        <div class="detail-label">
          ENTRY
        </div>

        <div
          class="detail-value"
          id="entry">
          $5,000
        </div>
      </div>

      <div>
        <div class="detail-label">
          EXIT
        </div>

        <div
          class="detail-value"
          id="exit">
          $17,450
        </div>
      </div>

    </div>

    <div class="date" id="date"></div>

  </div>

</div>


<script>

/* =========================
   VIDEO UPLOAD
========================= */

document
  .getElementById("videoInput")
  .addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const video =
      document.getElementById("backgroundVideo");

    const videoURL =
      URL.createObjectURL(file);

    video.src = videoURL;

    video.play();
  });


/* =========================
   UPDATE PNL
========================= */

function updatePNL() {

  document.getElementById("token").textContent =
    document.getElementById("tokenInput").value;

  document.getElementById("pnl").textContent =
    document.getElementById("pnlInput").value;

  document.getElementById("percent").textContent =
    document.getElementById("percentInput").value;

  document.getElementById("entry").textContent =
    document.getElementById("entryInput").value;

  document.getElementById("exit").textContent =
    document.getElementById("exitInput").value;
}


/* DATE */

document.getElementById("date").textContent =
  new Date().toLocaleString();

</script>

</body>
</html>
