<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>solsniper.sol — Performance</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;
}

.editor{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:24px 20px;
}

.editor h2{
  margin:0 0 22px;
  font-size:22px;
}

label{
  display:block;
  margin:14px 0 7px;
  color:#858585;
  font-size:13px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #262626;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#555;
}

input[type="file"]{
  padding:11px;
}

button{
  width:100%;
  padding:15px;
  margin-top:16px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#000;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}


/* =========================================
   PREMIUM 9:16 CARD
========================================= */

.preview{
  width:min(100%,430px);
  aspect-ratio:9 / 16;
  margin:28px auto;
  position:relative;
  overflow:hidden;
  background:#080808;
  border-radius:24px;
}


/* BACKGROUND VIDEO */

.video-bg{
  position:absolute;
  inset:0;
  overflow:hidden;
}

#video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  opacity:.55;
  filter:saturate(.85) contrast(1.08);
}

.video-bg::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.35) 0%,
      rgba(0,0,0,.20) 28%,
      rgba(0,0,0,.70) 62%,
      #050505 100%
    );
}


/* TOP BRAND */

.header{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  padding:24px 24px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  z-index:5;
}

.logo{
  font-size:18px;
  font-weight:850;
  letter-spacing:-.5px;
}

.logo span{
  color:#65f6bb;
}

.live{
  display:flex;
  align-items:center;
  gap:7px;

  padding:7px 10px;

  border:1px solid rgba(255,255,255,.18);
  border-radius:30px;

  background:rgba(0,0,0,.35);

  backdrop-filter:blur(10px);

  color:#ddd;
  font-size:10px;
  font-weight:700;
  letter-spacing:.7px;
  text-transform:uppercase;
}

.live-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#65f6bb;
}


/* CONTENT */

.content{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  padding:0 24px 25px;
  z-index:4;
}


/* DATE */

.date{
  color:#8d8d8d;
  font-size:11px;
  font-weight:600;
  letter-spacing:1px;
  text-transform:uppercase;
}


/* TITLE */

.title{
  margin-top:9px;

  font-size:27px;
  line-height:1.08;
  font-weight:800;
  letter-spacing:-1px;

  max-width:350px;
}


/* PERFORMANCE */

.performance{
  margin-top:22px;
  padding:19px;

  border:1px solid rgba(255,255,255,.13);
  border-radius:17px;

  background:rgba(8,8,8,.72);

  backdrop-filter:blur(18px);
}


/* TOKEN HEADER */

.token-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.token{
  font-size:13px;
  color:#aaa;
  font-weight:600;
}

.position{
  padding:5px 8px;

  border-radius:6px;

  background:rgba(101,246,187,.10);

  color:#65f6bb;

  font-size:9px;
  font-weight:800;
  letter-spacing:.7px;
  text-transform:uppercase;
}


/* MAIN PNL */

.pnl-row{
  display:flex;
  align-items:baseline;
  gap:8px;

  margin-top:6px;
}

.pnl{
  font-size:38px;
  line-height:1;
  font-weight:850;
  letter-spacing:-1.8px;
  color:#65f6bb;
}

.percent{
  font-size:14px;
  color:#65f6bb;
  font-weight:700;
}


/* PERFORMANCE LINE */

.graph{
  position:relative;

  height:42px;

  margin:18px 0 12px;

  border-bottom:1px solid rgba(255,255,255,.10);
}

.graph svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.graph-line{
  fill:none;
  stroke:#65f6bb;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.graph-glow{
  fill:none;
  stroke:#65f6bb;
  stroke-width:7;
  opacity:.12;
  filter:blur(4px);
}


/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  min-width:0;
}

.stat-label{
  color:#666;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.6px;
}

.stat-value{
  margin-top:5px;

  font-size:14px;
  font-weight:750;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* ENTRY / CURRENT */

.price-row{
  display:flex;
  justify-content:space-between;

  margin-top:17px;
  padding-top:14px;

  border-top:1px solid rgba(255,255,255,.08);
}

.price{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.price-label{
  color:#666;
  font-size:9px;
  text-transform:uppercase;
}

.price-value{
  font-size:13px;
  font-weight:700;
}


/* FOOTER */

.footer{
  margin-top:17px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.footer-brand{
  font-size:12px;
  font-weight:800;
  letter-spacing:.2px;
}

.footer-brand span{
  color:#65f6bb;
}

.footer-note{
  color:#666;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.8px;
}


/* PLAY */

.play{
  position:absolute;
  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  width:54px;
  height:54px;

  border-radius:50%;

  border:1px solid rgba(255,255,255,.25);

  background:rgba(0,0,0,.35);

  color:#fff;

  font-size:19px;

  z-index:10;

  backdrop-filter:blur(12px);

  cursor:pointer;
}


/* MOBILE */

@media(max-width:430px){

  .preview{
    border-radius:0;
  }

  .title{
    font-size:24px;
  }

  .pnl{
    font-size:34px;
  }

}
</style>
</head>

<body>

<!-- ================================
     EDITOR
================================ -->

<div class="editor">

<h2>solsniper.sol — PNL</h2>

<label>Background video</label>

<input
  type="file"
  id="videoInput"
  accept="video/*"
>

<label>Headline</label>

<input
  id="titleInput"
  value="A position worth watching"
>

<label>Token</label>

<input
  id="tokenInput"
  value="SOL"
>

<label>PNL</label>

<input
  id="pnlInput"
  value="+$12,450"
>

<label>Percentage</label>

<input
  id="percentInput"
  value="+248.7%"
>

<label>Invested</label>

<input
  id="investedInput"
  value="$5,000"
>

<label>Avg. entry</label>

<input
  id="entryInput"
  value="$100.20"
>

<label>Current</label>

<input
  id="currentInput"
  value="$348.70"
>

<label>Date</label>

<input
  id="dateInput"
  value="Oct 4, 2026"
>

<button onclick="updatePNL()">
Update Performance
</button>

</div>


<!-- ================================
     PREVIEW
================================ -->

<div class="preview">

  <div class="video-bg">

    <video
      id="video"
      muted
      playsinline
      loop>
    </video>

  </div>


  <div class="header">

    <div class="logo">
      solsniper<span>.sol</span>
    </div>

    <div class="live">
      <span class="live-dot"></span>
      Performance
    </div>

  </div>


  <button
    class="play"
    onclick="playVideo()">
    ▶
  </button>


  <div class="content">

    <div
      class="date"
      id="date">
      Oct 4, 2026
    </div>


    <div
      class="title"
      id="title">
      A position worth watching
    </div>


    <div class="performance">

      <div class="token-row">

        <div
          class="token"
          id="token">
          SOL
        </div>

        <div class="position">
          Closed position
        </div>

      </div>


      <div class="pnl-row">

        <div
          class="pnl"
          id="pnl">
          +$12,450
        </div>

        <div
          class="percent"
          id="percent">
          +248.7%
        </div>

      </div>


      <div class="graph">

        <svg
          viewBox="0 0 340 50"
          preserveAspectRatio="none">

          <path
            class="graph-glow"
            d="M0 43 C35 42 48 39 70 40 C95 41 103 33 123 35 C145 38 157 28 175 30 C195 32 207 17 226 22 C244 26 253 12 270 15 C290 18 302 5 340 3"
          />

          <path
            class="graph-line"
            d="M0 43 C35 42 48 39 70 40 C95 41 103 33 123 35 C145 38 157 28 175 30 C195 32 207 17 226 22 C244 26 253 12 270 15 C290 18 302 5 340 3"
          />

        </svg>

      </div>


      <div class="stats">

        <div class="stat">

          <div class="stat-label">
            Invested
          </div>

          <div
            class="stat-value"
            id="invested">
            $5,000
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            Entry
          </div>

          <div
            class="stat-value"
            id="entry">
            $100.20
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            Current
          </div>

          <div
            class="stat-value"
            id="current">
            $348.70
          </div>

        </div>

      </div>


      <div class="price-row">

        <div class="price">

          <div class="price-label">
            Entry price
          </div>

          <div
            class="price-value"
            id="entryBottom">
            $100.20
          </div>

        </div>


        <div class="price">

          <div class="price-label">
            Exit price
          </div>

          <div
            class="price-value"
            id="currentBottom">
            $348.70
          </div>

        </div>

      </div>

    </div>


    <div class="footer">

      <div class="footer-brand">
        solsniper<span>.sol</span>
      </div>

      <div class="footer-note">
        Trading performance
      </div>

    </div>

  </div>

</div>


<script>

const videoInput =
  document.getElementById("videoInput");

videoInput.addEventListener("change",function(){

  const file=this.files[0];

  if(!file) return;

  const video=
    document.getElementById("video");

  const url=
    URL.createObjectURL(file);

  video.src=url;

  video.load();

  video.play().catch(()=>{});

});


function playVideo(){

  const video=
    document.getElementById("video");

  if(video.paused){

    video.play();

  }else{

    video.pause();

  }

}


function updatePNL(){

  document.getElementById("title").textContent =
    document.getElementById("titleInput").value;

  document.getElementById("token").textContent =
    document.getElementById("tokenInput").value;

  document.getElementById("pnl").textContent =
    document.getElementById("pnlInput").value;

  document.getElementById("percent").textContent =
    document.getElementById("percentInput").value;

  document.getElementById("invested").textContent =
    document.getElementById("investedInput").value;

  document.getElementById("entry").textContent =
    document.getElementById("entryInput").value;

  document.getElementById("current").textContent =
    document.getElementById("currentInput").value;

  document.getElementById("entryBottom").textContent =
    document.getElementById("entryInput").value;

  document.getElementById("currentBottom").textContent =
    document.getElementById("currentInput").value;

  document.getElementById("date").textContent =
    document.getElementById("dateInput").value;

}

</script>

</body>
</html>
