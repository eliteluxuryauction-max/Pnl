<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>solsniper.sol — Performance</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;
}

.editor{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:24px 20px;
}

.editor h2{
  margin:0 0 22px;
  font-size:22px;
}

label{
  display:block;
  margin:14px 0 7px;
  color:#858585;
  font-size:13px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #262626;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#555;
}

input[type="file"]{
  padding:11px;
}

.editor button{
  width:100%;
  padding:15px;
  margin-top:16px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#000;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}


/* =========================================
   PREMIUM 9:16 CARD
========================================= */

.preview{
  width:min(100%,430px);
  aspect-ratio:9 / 16;
  margin:28px auto;
  position:relative;
  overflow:hidden;
  background:#080808;
  border-radius:24px;
}


/* =========================================
   BACKGROUND VIDEO
========================================= */

.video-bg{
  position:absolute;
  inset:0;
  overflow:hidden;
}

#video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;

  opacity:1;

  filter:
    saturate(.95)
    contrast(1.02);
}

.video-bg::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.08) 0%,
      rgba(0,0,0,.04) 30%,
      rgba(0,0,0,.30) 65%,
      rgba(5,5,5,.72) 100%
    );

  pointer-events:none;
}


/* =========================================
   TOP BRAND
========================================= */

.header{
  position:absolute;

  top:0;
  left:0;

  width:100%;

  padding:24px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  z-index:5;
}

.logo{
  font-size:18px;
  font-weight:850;
  letter-spacing:-.5px;
}

.logo span{
  color:#65f6bb;
}

.live{
  display:flex;
  align-items:center;
  gap:7px;

  padding:7px 10px;

  border:1px solid rgba(255,255,255,.18);
  border-radius:30px;

  background:rgba(0,0,0,.35);

  backdrop-filter:blur(10px);

  color:#ddd;

  font-size:10px;
  font-weight:700;

  letter-spacing:.7px;
  text-transform:uppercase;
}

.live-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#65f6bb;
}


/* =========================================
   CONTENT
========================================= */

.content{
  position:absolute;

  left:0;
  bottom:0;

  width:100%;

  padding:0 24px 25px;

  z-index:4;
}


/* =========================================
   DATE
========================================= */

.date{
  color:#8d8d8d;

  font-size:11px;
  font-weight:600;

  letter-spacing:1px;

  text-transform:uppercase;
}


/* =========================================
   TITLE
========================================= */

.title{
  margin-top:9px;

  font-size:27px;
  line-height:1.08;

  font-weight:800;

  letter-spacing:-1px;

  max-width:350px;
}


/* =========================================
   PERFORMANCE CARD
========================================= */

.performance{
  margin-top:22px;

  padding:19px;

  border:1px solid rgba(255,255,255,.13);

  border-radius:17px;

  background:rgba(8,8,8,.72);

  backdrop-filter:blur(18px);
}


/* =========================================
   TOKEN HEADER
========================================= */

.token-row{
  display:flex;

  justify-content:space-between;
  align-items:center;
}

.token{
  font-size:13px;

  color:#aaa;

  font-weight:600;
}

.position{
  padding:5px 8px;

  border-radius:6px;

  background:rgba(101,246,187,.10);

  color:#65f6bb;

  font-size:9px;

  font-weight:800;

  letter-spacing:.7px;

  text-transform:uppercase;
}


/* =========================================
   MAIN PNL
========================================= */

.pnl-row{
  display:flex;

  align-items:baseline;

  gap:8px;

  margin-top:6px;
}

.pnl{
  font-size:38px;

  line-height:1;

  font-weight:850;

  letter-spacing:-1.8px;

  color:#65f6bb;
}

.percent{
  font-size:14px;

  color:#65f6bb;

  font-weight:700;
}


/* =========================================
   PERFORMANCE GRAPH
========================================= */

.graph{
  position:relative;

  width:100%;
  height:55px;

  margin:18px 0 12px;

  border-bottom:
    1px solid rgba(255,255,255,.10);

  overflow:visible;
}

.chart{
  width:100%;
  height:100%;
}

.chart svg{
  display:block;

  width:100%;
  height:100%;

  overflow:visible;
}


/* GRAPH AREA */

#chartArea{
  transition:all .25s ease;
}


/* GRAPH LINE */

#chartLine{
  transition:
    stroke .25s ease,
    d .25s ease;
}


/* =========================================
   STATS
========================================= */

.stats{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;
}

.stat{
  min-width:0;
}

.stat-label{
  color:#666;

  font-size:9px;

  text-transform:uppercase;

  letter-spacing:.6px;
}

.stat-value{
  margin-top:5px;

  font-size:14px;

  font-weight:750;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================================
   ENTRY / CURRENT
========================================= */

.price-row{
  display:flex;

  justify-content:space-between;

  margin-top:17px;

  padding-top:14px;

  border-top:
    1px solid rgba(255,255,255,.08);
}

.price{
  display:flex;

  flex-direction:column;

  gap:4px;
}

.price-label{
  color:#666;

  font-size:9px;

  text-transform:uppercase;
}

.price-value{
  font-size:13px;

  font-weight:700;
}


/* =========================================
   FOOTER
========================================= */

.footer{
  margin-top:17px;

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.footer-brand{
  font-size:12px;

  font-weight:800;

  letter-spacing:.2px;
}

.footer-brand span{
  color:#65f6bb;
}

.footer-note{
  color:#666;

  font-size:9px;

  text-transform:uppercase;

  letter-spacing:.8px;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:430px){

  .preview{
    border-radius:0;
  }

  .title{
    font-size:24px;
  }

  .pnl{
    font-size:34px;
  }

}
</style>
</head>


<body>


<!-- ========================================
     EDITOR
======================================== -->

<div class="editor">

  <h2>solsniper.sol — PNL</h2>


  <label>
    Background video
  </label>

  <input
    type="file"
    id="videoInput"
    accept="video/*"
  >


  <label>
    Headline
  </label>

  <input
    id="titleInput"
    value="A position worth watching"
  >


  <label>
    Token
  </label>

  <input
    id="tokenInput"
    value="SOL"
  >


  <label>
    PNL
  </label>

  <input
    id="pnlInput"
    value="+$12,450"
  >


  <label>
    Percentage
  </label>

  <input
    id="percentInput"
    value="+248.7%"
  >


  <label>
    Invested
  </label>

  <input
    id="investedInput"
    value="$5,000"
  >


  <label>
    Avg. entry
  </label>

  <input
    id="entryInput"
    value="$100.20"
  >


  <label>
    Current
  </label>

  <input
    id="currentInput"
    value="$348.70"
  >


  <label>
    Date
  </label>

  <input
    id="dateInput"
    value="Oct 4, 2026"
  >


  <button onclick="updatePNL()">
    Update Performance
  </button>

</div>



<!-- ========================================
     PREVIEW
========================================= -->

<div class="preview">


  <!-- VIDEO -->

  <div class="video-bg">

    <video
      id="video"
      muted
      playsinline
      autoplay
      loop
      preload="auto">
    </video>

  </div>



  <!-- HEADER -->

  <div class="header">

    <div class="logo">
      solsniper<span>.sol</span>
    </div>


    <div class="live">

      <span class="live-dot"></span>

      Performance

    </div>

  </div>



  <!-- CONTENT -->

  <div class="content">


    <!-- DATE -->

    <div
      class="date"
      id="date">

      Oct 4, 2026

    </div>



    <!-- TITLE -->

    <div
      class="title"
      id="title">

      A position worth watching

    </div>



    <!-- PERFORMANCE CARD -->

    <div class="performance">


      <!-- TOKEN -->

      <div class="token-row">

        <div
          class="token"
          id="token">

          SOL

        </div>


        <div class="position">

          Closed position

        </div>

      </div>



      <!-- PNL -->

      <div class="pnl-row">

        <div
          class="pnl"
          id="pnl">

          +$12,450

        </div>


        <div
          class="percent"
          id="percent">

          +248.7%

        </div>

      </div>



      <!-- GRAPH -->

      <div class="graph">

        <div class="chart">

          <svg
            viewBox="0 0 400 100"
            preserveAspectRatio="none">

            <defs>

              <linearGradient
                id="chartFill"
                x1="0"
                x2="0"
                y1="0"
                y2="1">

                <stop
                  id="fillTop"
                  offset="0%"
                  stop-color="#65e6a5"
                  stop-opacity=".22"/>

                <stop
                  id="fillBottom"
                  offset="100%"
                  stop-color="#65e6a5"
                  stop-opacity="0"/>

              </linearGradient>

            </defs>


            <!-- AREA -->

            <path
              id="chartArea"
              d=""
              fill="url(#chartFill)"/>


            <!-- LINE -->

            <path
              id="chartLine"
              d=""
              fill="none"
              stroke="#65e6a5"
              stroke-width="2.5"
              vector-effect="non-scaling-stroke"
              stroke-linecap="round"
              stroke-linejoin="round"/>

          </svg>

        </div>

      </div>



      <!-- STATS -->

      <div class="stats">


        <div class="stat">

          <div class="stat-label">
            Invested
          </div>

          <div
            class="stat-value"
            id="invested">

            $5,000

          </div>

        </div>



        <div class="stat">

          <div class="stat-label">
            Entry
          </div>

          <div
            class="stat-value"
            id="entry">

            $100.20

          </div>

        </div>



        <div class="stat">

          <div class="stat-label">
            Current
          </div>

          <div
            class="stat-value"
            id="current">

            $348.70

          </div>

        </div>

      </div>



      <!-- PRICE ROW -->

      <div class="price-row">


        <div class="price">

          <div class="price-label">
            Entry price
          </div>

          <div
            class="price-value"
            id="entryBottom">

            $100.20

          </div>

        </div>



        <div class="price">

          <div class="price-label">
            Exit price
          </div>

          <div
            class="price-value"
            id="currentBottom">

            $348.70

          </div>

        </div>

      </div>

    </div>



    <!-- FOOTER -->

    <div class="footer">


      <div class="footer-brand">

        solsniper<span>.sol</span>

      </div>


      <div class="footer-note">

        Trading performance

      </div>

    </div>


  </div>

</div>



<script>

/* =========================================
   VIDEO UPLOAD
========================================= */

const videoInput =
  document.getElementById("videoInput");

videoInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  const video =
    document.getElementById("video");

  const url =
    URL.createObjectURL(file);

  video.src = url;

  video.load();

  video.play().catch(() => {

    console.log(
      "Browser blocked autoplay."
    );

  });

});



/* =========================================
   MONEY PARSER
========================================= */

function parseMoney(value){

  const cleaned =
    String(value)
      .replace(/[$,%\s,]/g,"");

  return parseFloat(cleaned);

}



/* =========================================
   MONEY FORMATTER
========================================= */

function formatMoney(value){

  if(!Number.isFinite(value))
    return "—";

  const sign =
    value >= 0 ? "+" : "-";

  return sign +
    "$" +
    Math.abs(value).toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}



/* =========================================
   PERCENT FORMATTER
========================================= */

function formatPercent(value){

  if(!Number.isFinite(value))
    return "—";

  const sign =
    value >= 0 ? "+" : "-";

  return sign +
    Math.abs(value).toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    ) +
    "%";

}



/* =========================================
   PRICE FORMATTER
========================================= */

function formatPrice(value){

  if(!Number.isFinite(value))
    return "—";

  if(value < 0.01){

    return "$" +
      value.toLocaleString(
        "en-US",
        {
          minimumFractionDigits:0,
          maximumFractionDigits:8
        }
      );

  }

  return "$" +
    value.toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}



/* =========================================
   UPDATE GRAPH
========================================= */

function updateChart(isLoss){

  const chartLine =
    document.getElementById(
      "chartLine"
    );

  const chartArea =
    document.getElementById(
      "chartArea"
    );

  const fillTop =
    document.getElementById(
      "fillTop"
    );

  const fillBottom =
    document.getElementById(
      "fillBottom"
    );


  if(!chartLine || !chartArea)
    return;



  /* =====================================
     LOSS GRAPH
  ===================================== */

  if(isLoss){

    const lossPath = `
      M0 10
      C18 12 35 19 52 18
      C70 17 84 28 102 25
      C121 22 137 34 155 31
      C174 28 190 43 208 40
      C228 37 244 51 263 48
      C283 45 300 59 320 56
      C340 53 357 72 376 78
      C386 83 394 90 400 95
    `;

    const lossArea = `
      ${lossPath}
      L400 100
      L0 100
      Z
    `;


    chartLine.setAttribute(
      "d",
      lossPath
    );

    chartArea.setAttribute(
      "d",
      lossArea
    );


    chartLine.style.stroke =
      "#ff5c5c";


    if(fillTop){

      fillTop.style.stopColor =
        "#ff5c5c";

    }


    if(fillBottom){

      fillBottom.style.stopColor =
        "#ff5c5c";

    }

  }


  /* =====================================
     PROFIT GRAPH
  ===================================== */

  else{

    const profitPath = `
      M0 88
      C18 86 35 80 52 82
      C70 84 86 74 104 77
      C122 80 137 65 155 69
      C174 73 190 54 208 59
      C227 64 243 45 263 49
      C282 53 298 34 317 38
      C337 42 351 20 369 25
      C383 29 392 15 400 7
    `;

    const profitArea = `
      ${profitPath}
      L400 100
      L0 100
      Z
    `;


    chartLine.setAttribute(
      "d",
      profitPath
    );

    chartArea.setAttribute(
      "d",
      profitArea
    );


    chartLine.style.stroke =
      "#65e6a5";


    if(fillTop){

      fillTop.style.stopColor =
        "#65e6a5";

    }


    if(fillBottom){

      fillBottom.style.stopColor =
        "#65e6a5";

    }

  }

}



/* =========================================
   MAIN UPDATE
========================================= */

function updatePNL(){

  const titleInput =
    document.getElementById(
      "titleInput"
    );

  const tokenInput =
    document.getElementById(
      "tokenInput"
    );

  const investedInput =
    document.getElementById(
      "investedInput"
    );

  const entryInput =
    document.getElementById(
      "entryInput"
    );

  const currentInput =
    document.getElementById(
      "currentInput"
    );

  const dateInput =
    document.getElementById(
      "dateInput"
    );


  const invested =
    parseMoney(
      investedInput.value
    );

  const entry =
    parseMoney(
      entryInput.value
    );

  const exit =
    parseMoney(
      currentInput.value
    );



  /* =====================================
     BASIC TEXT
  ===================================== */

  document.getElementById(
    "title"
  ).textContent =
    titleInput.value;


  document.getElementById(
    "token"
  ).textContent =
    tokenInput.value;


  document.getElementById(
    "date"
  ).textContent =
    dateInput.value;



  /* =====================================
     INVESTED
  ===================================== */

  document.getElementById(
    "invested"
  ).textContent =

    Number.isFinite(invested)

      ? "$" +
        invested.toLocaleString(
          "en-US",
          {
            minimumFractionDigits:0,
            maximumFractionDigits:2
          }
        )

      : "—";



  /* =====================================
     ENTRY / EXIT
  ===================================== */

  document.getElementById(
    "entry"
  ).textContent =
    formatPrice(entry);


  document.getElementById(
    "current"
  ).textContent =
    formatPrice(exit);


  document.getElementById(
    "entryBottom"
  ).textContent =
    formatPrice(entry);


  document.getElementById(
    "currentBottom"
  ).textContent =
    formatPrice(exit);



  /* =====================================
     CALCULATE PNL
  ===================================== */

  if(
    Number.isFinite(invested) &&
    Number.isFinite(entry) &&
    Number.isFinite(exit) &&
    entry !== 0
  ){

    const roi =
      ((exit - entry) / entry) *
      100;


    const profit =
      invested *
      (roi / 100);


    const isLoss =
      profit < 0;


    const pnlEl =
      document.getElementById(
        "pnl"
      );


    const percentEl =
      document.getElementById(
        "percent"
      );



    /* PNL */

    pnlEl.textContent =
      formatMoney(profit);



    /* ROI */

    percentEl.textContent =
      formatPercent(roi);



    /* =================================
       COLORS
    ================================= */

    const color =
      isLoss
        ? "#ff5c5c"
        : "#65e6a5";


    pnlEl.style.color =
      color;


    percentEl.style.color =
      color;



    /* =================================
       GRAPH
    ================================= */

    updateChart(
      isLoss
    );



    /* =================================
       UPDATE EDITOR VALUES
    ================================= */

    const pnlInput =
      document.getElementById(
        "pnlInput"
      );


    const percentInput =
      document.getElementById(
        "percentInput"
      );


    if(pnlInput){

      pnlInput.value =
        formatMoney(profit);

    }


    if(percentInput){

      percentInput.value =
        formatPercent(roi);

    }

  }


  /* =====================================
     INVALID VALUES
  ===================================== */

  else{

    document.getElementById(
      "pnl"
    ).textContent =
      "—";


    document.getElementById(
      "percent"
    ).textContent =
      "—";


    document.getElementById(
      "pnl"
    ).style.color =
      "#65e6a5";


    document.getElementById(
      "percent"
    ).style.color =
      "#65e6a5";

  }

}



/* =========================================
   AUTO RECALCULATION
========================================= */

[
  "titleInput",
  "tokenInput",
  "investedInput",
  "entryInput",
  "currentInput",
  "dateInput"
].forEach(function(id){

  const input =
    document.getElementById(id);


  if(input){

    input.addEventListener(
      "input",
      updatePNL
    );

  }

});



/* =========================================
   INITIAL CALCULATION
========================================= */

updatePNL();

</script>

</body>
</html>
