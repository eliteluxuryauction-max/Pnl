<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>solsniper.sol PNL</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.editor{
  width:100%;
  max-width:500px;
  margin:auto;
  padding:20px;
}

.editor h2{
  margin:0 0 20px;
}

label{
  display:block;
  margin:12px 0 6px;
  color:#aaa;
  font-size:14px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #333;
  border-radius:8px;
  background:#151515;
  color:#fff;
  font-size:16px;
}

input[type="file"]{
  padding:10px;
}

button{
  width:100%;
  padding:14px;
  margin-top:14px;
  border:0;
  border-radius:8px;
  background:#5d45ff;
  color:#fff;
  font-size:16px;
  font-weight:700;
}


/* =========================
   9:16 PNL PREVIEW
========================= */

.preview{
  width:min(100%,430px);
  aspect-ratio:9 / 16;
  margin:25px auto;
  position:relative;
  overflow:hidden;
  background:#15111e;
}


/* TOP BLACK AREA */

.top-space{
  height:22%;
  background:#000;
}


/* VIDEO AREA */

.video-area{
  position:absolute;
  top:18%;
  left:2%;
  width:96%;
  height:56%;

  overflow:hidden;

  border:3px solid #4d55ff;
  border-radius:28px;

  background:#080810;
}

#video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}


/* VIDEO DARKEN */

.video-overlay{
  position:absolute;
  inset:0;

  background:linear-gradient(
    180deg,
    rgba(0,0,0,.05),
    rgba(0,0,0,.15)
  );
}


/* PLAY */

.play{
  position:absolute;
  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:60px;
  height:60px;

  border-radius:50%;
  border:0;

  background:rgba(0,0,0,.65);

  color:#fff;
  font-size:25px;
}


/* TITLE */

.title{
  position:absolute;
  top:25%;
  left:8%;
  width:84%;

  text-align:center;

  font-size:25px;
  font-weight:700;

  text-shadow:0 2px 8px #000;
}


/* DATE */

.date{
  position:absolute;
  top:21%;
  right:8%;

  font-size:14px;
  color:#aaa;
}


/* PNL CARD */

.pnl-card{
  position:absolute;

  left:4%;
  width:92%;
  top:48%;

  padding:25px 15px 20px;

  border-radius:20px;

  background:rgba(13,11,22,.94);

  border:1px solid rgba(255,255,255,.12);

  text-align:center;
}

.token{
  font-size:18px;
  font-weight:600;
}

.pnl{
  margin-top:8px;

  font-size:42px;
  font-weight:800;

  color:#ff563f;
}

.percent{
  display:inline-block;
  margin-left:5px;

  font-size:18px;
  color:#fff;
}


/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  margin-top:20px;

  border-top:1px solid #292633;
}

.stat{
  padding:13px 4px;

  border-right:1px solid #292633;
}

.stat:last-child{
  border-right:0;
}

.stat-label{
  font-size:12px;
  color:#aaa;
}

.stat-value{
  margin-top:5px;

  font-size:17px;
  font-weight:700;
}


/* FOOTER */

.footer{
  position:absolute;

  bottom:0;
  left:0;

  width:100%;
  height:24%;

  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  padding:25px 28px;

  background:#4d5cff;
}

.brand{
  font-size:29px;
  font-weight:800;
}

.brand span{
  color:#1df0a2;
}

.footer-right{
  text-align:right;
  font-size:13px;
}

.footer-right strong{
  display:block;
  margin-top:3px;
  font-size:18px;
}


/* SMALL PHONES */

@media(max-width:430px){

  .title{
    font-size:20px;
  }

  .pnl{
    font-size:34px;
  }

  .token{
    font-size:16px;
  }

  .stat-value{
    font-size:15px;
  }

  .brand{
    font-size:24px;
  }

}
</style>
</head>


<body>


<!-- =========================
     EDITOR
========================= -->

<div class="editor">

<h2>solsniper.sol PNL</h2>

<label>Upload background video</label>

<input
  type="file"
  id="videoInput"
  accept="video/*">


<label>Title</label>

<input
  id="titleInput"
  value="POV: You caught the move early">


<label>Token</label>

<input
  id="tokenInput"
  value="SOL">


<label>PNL</label>

<input
  id="pnlInput"
  value="+$12,450">


<label>Percentage</label>

<input
  id="percentInput"
  value="+248.7%">


<label>Invested</label>

<input
  id="investedInput"
  value="$5,000">


<label>Avg. entry</label>

<input
  id="entryInput"
  value="$100.20">


<label>Current</label>

<input
  id="currentInput"
  value="$348.70">


<label>Date</label>

<input
  id="dateInput"
  value="Oct 4, 2026">


<button onclick="updatePNL()">
Update PNL
</button>

</div>



<!-- =========================
     PREVIEW
========================= -->

<div class="preview">

  <div class="top-space"></div>


  <!-- VIDEO -->

  <div class="video-area">

    <video
      id="video"
      muted
      playsinline
      loop>
    </video>

    <div class="video-overlay"></div>

    <button
      class="play"
      onclick="playVideo()">
      ▶
    </button>

  </div>


  <!-- TITLE -->

  <div
    class="title"
    id="title">
    POV: You caught the move early
  </div>


  <!-- DATE -->

  <div
    class="date"
    id="date">
    Oct 4, 2026
  </div>


  <!-- PNL -->

  <div class="pnl-card">

    <div
      class="token"
      id="token">
      SOL
    </div>


    <div>

      <span
        class="pnl"
        id="pnl">
        +$12,450
      </span>

      <span
        class="percent"
        id="percent">
        (+248.7%)
      </span>

    </div>


    <div class="stats">

      <div class="stat">

        <div class="stat-label">
          Invested
        </div>

        <div
          class="stat-value"
          id="invested">
          $5,000
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Avg. entry
        </div>

        <div
          class="stat-value"
          id="entry">
          $100.20
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Current
        </div>

        <div
          class="stat-value"
          id="current">
          $348.70
        </div>

      </div>

    </div>

  </div>


  <!-- FOOTER -->

  <div class="footer">

    <div class="brand">
      solsniper<span>.sol</span>
    </div>

    <div class="footer-right">
      Powered by
      <strong>solsniper.sol</strong>
    </div>

  </div>

</div>



<script>

/* =========================
   VIDEO UPLOAD
========================= */

document
.getElementById("videoInput")
.addEventListener("change", function(){

  const file=this.files[0];

  if(!file) return;

  const video=document.getElementById("video");

  const url=URL.createObjectURL(file);

  video.src=url;

  video.load();

  video.play().catch(()=>{
    console.log("Autoplay blocked. Press play.");
  });

});


/* =========================
   PLAY VIDEO
========================= */

function playVideo(){

  const video=document.getElementById("video");

  if(video.paused){
    video.play();
  }else{
    video.pause();
  }

}


/* =========================
   UPDATE PNL
========================= */

function updatePNL(){

  document.getElementById("title").textContent =
    document.getElementById("titleInput").value;

  document.getElementById("token").textContent =
    document.getElementById("tokenInput").value;

  document.getElementById("pnl").textContent =
    document.getElementById("pnlInput").value;

  document.getElementById("percent").textContent =
    "(" +
    document.getElementById("percentInput").value +
    ")";

  document.getElementById("invested").textContent =
    document.getElementById("investedInput").value;

  document.getElementById("entry").textContent =
    document.getElementById("entryInput").value;

  document.getElementById("current").textContent =
    document.getElementById("currentInput").value;

  document.getElementById("date").textContent =
    document.getElementById("dateInput").value;

}

</script>

</body>
</html>
